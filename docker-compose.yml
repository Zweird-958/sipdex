services:
  postgres:
    image: postgres:18
    container_name: fantadex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fantadex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fantadex}
      POSTGRES_DB: ${POSTGRES_DB:-fantadex}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-fantadex} -d ${POSTGRES_DB:-fantadex}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-test:
    image: postgres:18
    container_name: fantadex-postgres-test
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_TEST_USER:-fantadex}
      POSTGRES_PASSWORD: ${POSTGRES_TEST_PASSWORD:-fantadex}
      POSTGRES_DB: ${POSTGRES_TEST_DB:-fantadex_test}
    ports:
      - "${POSTGRES_TEST_PORT:-5433}:5432"
    volumes:
      - ./data/postgres-test:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_TEST_USER:-fantadex} -d ${POSTGRES_TEST_DB:-fantadex_test}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  rustfs:
    image: rustfs/rustfs:latest
    container_name: fantadex-rustfs
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:-rustfsadmin}
    ports:
      - "${S3_PORT:-9000}:9000" # S3 API
      - "${S3_CONSOLE_PORT:-9001}:9001" # Web console
    volumes:
      - ./data/rustfs:/mnt/rustfs/data
